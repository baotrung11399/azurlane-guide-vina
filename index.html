    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg-rainbow: linear-gradient(120deg, #FFADAD, #FFD6A5, #FDFFB6, #CAFFBF, #9BF6FF, #A0C4FF, #BDB2FF, #FFC6FF);
            --bg-yellow: linear-gradient(120deg, #FFF9C4, #FFF176, #FFEE58, #FDD835);
            --bg-purple: linear-gradient(120deg, #F3E5F5, #E1BEE7, #CE93D8, #BA68C8);
            --bg-blue: linear-gradient(120deg, #E1F5FE, #B3E5FC, #81D4FA, #4FC3F7, #29B6F6);
            --bg-gray: #f7f9fa;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f4f4f9;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            max-width: 1600px;
        }

        .row-card {
            display: grid;
            grid-template-columns: 100px 180px 130px 120px 540px 1fr;
            align-items: stretch;
            background-color: #fff;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            gap: 25px;
        }

        .col-name {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #333;
        }

        .col-image {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .base-box {
            width: 100%;
            max-width: 216px;
            height: auto;
            aspect-ratio: 3 / 4;
            border: none;
            padding: 0;
            overflow: hidden;
            display: block;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .base-box:hover {
            transform: translateY(-5px);
        }

        .box-rainbow {
            background: var(--bg-rainbow);
        }

        .box-yellow {
            background: var(--bg-yellow);
        }

        .box-purple {
            background: var(--bg-purple);
        }

        .box-blue {
            background: var(--bg-blue);
        }

        .box-link {
            display: block;
            width: 100%;
            height: 100%;
        }

        .box-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: none;
        }

        .col-tier,
        .col-role,
        .col-equip {
            display: grid;
            grid-template-rows: 35% 65%;
            text-align: center;
        }

        .col-tier,
        .col-role {
            border-left: 1px solid #eee;
            padding: 0;
        }

        .col-tier>div,
        .col-role>div {
            transform: translateX(12.5px);
        }

        .col-equip {
            border-left: 1px solid #eee;
            border-right: 1px solid #eee;
            padding: 0;
        }

        .label-style {
            font-size: 16px;
            color: #999;
            text-transform: uppercase;
            font-weight: bold;
            align-self: end;
            padding-bottom: 12px;
        }

        .tier-value {
            font-size: 48px;
            font-weight: 900;
            color: #e74c3c;
            line-height: 1.1;
            align-self: start;
            padding-top: 12px;
        }

        .role-value {
            font-size: 18px;
            font-weight: bold;
            color: #2980b9;
            line-height: 1.4;
            align-self: start;
            padding-top: 12px;
        }

        .col-desc {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 500;
            color: #555;
            text-align: justify;
        }

        .equip-group {
            display: flex;
            flex-direction: row;
            gap: 14px;
            justify-content: center;
            flex-wrap: nowrap;
            align-self: start;
            padding-top: 12px;
        }

        .equip-slot {
            position: relative;
            width: 74px;
            height: 74px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .equip-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 6px;
            background: var(--gear-bg, var(--bg-gray));
            border: 4px solid #cbd5e1;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .equip-box::before {
            content: attr(data-label);
            position: absolute;
            top: 0;
            right: 0;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 1px 4px;
            border-bottom-left-radius: 4px;
            z-index: 10;
            pointer-events: none;
        }

        .equip-box:not([data-label])::before {
            display: none;
        }

        .equip-box::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: var(--gear-img);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        .equip-slot .equip-box[data-state="1"] {
            z-index: 9;
            transform: translate(0, 0);
        }

        .equip-slot .equip-box[data-state="2"] {
            z-index: 8;
            transform: translate(8px, 20px);
        }

        .equip-slot .equip-box[data-state="3"] {
            z-index: 7;
            transform: translate(8px, 20px);
        }

        .equip-slot .equip-box[data-state="4"] {
            z-index: 6;
            transform: translate(8px, 20px);
        }

        .equip-slot .equip-box[data-state="5"] {
            z-index: 5;
            transform: translate(8px, 20px);
        }

        .equip-slot .equip-box[data-state="6"] {
            z-index: 4;
            transform: translate(8px, 20px);
        }

        .equip-slot .equip-box[data-state="7"] {
            z-index: 3;
            transform: translate(8px, 20px);
        }

        .equip-slot .equip-box[data-state="8"] {
            z-index: 2;
            transform: translate(8px, 20px);
        }

        .equip-slot .equip-box[data-state="9"] {
            z-index: 1;
            transform: translate(8px, 20px);
        }

        function renderTierList() {
            const container = document.getElementById('tierlist-container');
            let finalHTML = '';

            characterData.forEach(char => {
                let rolesHTML = char.roles.join('<br>');

                let descHTML = char.desc.map(d => `<div>${d}</div>`).join('');

                let equipHTML = '';
                char.equipSlots.forEach(slotArray => {
                    let totalInSlot = slotArray.length;
                    let isMulti = totalInSlot > 1;
                    let clickEvent = isMulti ? ` onclick="cycleEquip(this)"` : '';

                    let boxesHTML = '';
                    slotArray.forEach((itemId, index) => {
                        let stateNumber = index + 1;
                        let labelAttr = isMulti ? ` data-label="${stateNumber}/${totalInSlot}"` : '';

                        boxesHTML += `<div class="equip-box ${itemId}" data-state="${stateNumber}"${labelAttr}></div>`;
                    });

                    equipHTML += `<div class="equip-slot"${clickEvent}>${boxesHTML}</div>`;
                });

                finalHTML += `
                <div class="row-card">
                    <div class="col-name">${char.name}</div>
                    <div class="col-image">
                        <div class="base-box ${char.bgClass}">
                            <a href="${char.link || '#'}" class="box-link" target="_blank">
                                <img src="${char.image}" alt="${char.name}">
                            </a>
                        </div>
                    </div>
                    <div class="col-tier">
                        <div class="label-style">Tier</div>
                        <div class="tier-value">${char.tier}</div>
                    </div>
                    <div class="col-role">
                        <div class="label-style">Vai trò</div>
                        <div class="role-value">${rolesHTML}</div>
                    </div>
                    <div class="col-equip">
                        <div class="label-style">Trang bị khuyến nghị</div>
                        <div class="equip-group">${equipHTML}</div>
                    </div>
                    <div class="col-desc">${descHTML}</div>
                </div>
                `;
            });

            container.innerHTML = finalHTML;
        }

        function cycleEquip(slot) {
            const items = Array.from(slot.querySelectorAll('.equip-box'));
            if (items.length <= 1) return;
            const states = items.map(item => item.getAttribute('data-state'));
            states.unshift(states.pop());
            items.forEach((item, index) => {
                item.setAttribute('data-state', states[index]);
            });
        }

        renderTierList();
    </script>
